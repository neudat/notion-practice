
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운명의 달리기 랜덤 뽑기</title>
  <style>
    /* 기존 보라색 위젯 디자인과 노션 임베드 스타일 유지 */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: #f8f9fc;
      color: #252832;
      font-family: -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    .widget {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      border: 1px solid #e8eaf1;
      border-radius: 16px;
      background: #fff;
    }

    h1 { margin: 0 0 6px; font-size: 21px; }

    .description {
      margin: 0 0 18px;
      color: #626978;
      font-size: 13px;
      line-height: 1.5;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 12px;
      border: 1px solid #d7dbe5;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }

    textarea:disabled { background: #f6f6fa; }

    button { font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #c8b9ff;
      outline-offset: 3px;
    }

    /* 기존: 당첨 인원 선택 */
    .count-field, .repeat-field { margin-top: 16px; }

    .stepper {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 260px;
    }

    .stepper-button {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: 1px solid #d7dbe5;
      border-radius: 10px;
      background: #f2f0ff;
      color: #4e3bb1;
      font-size: 25px;
      font-weight: 700;
    }

    .stepper-button:hover:not(:disabled) {
      background: #e7e1ff;
    }

    .stepper-value {
      flex: 1;
      min-width: 58px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
    }

    .help {
      margin: 7px 0 0;
      color: #626978;
      font-size: 12px;
      line-height: 1.5;
    }

    /* 기존: 중복 당첨 방지 ON/OFF */
    .repeat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .repeat-title {
      font-size: 14px;
      font-weight: 700;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle {
      position: relative;
      width: 50px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 100px;
      background: #c9ccd5;
      transition: background .15s;
    }

    .toggle[aria-checked="true"] {
      background: #6750d9;
    }

    .toggle-knob {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px #0002;
      transition: transform .15s;
      pointer-events: none;
    }

    .toggle[aria-checked="true"] .toggle-knob {
      transform: translateX(22px);
    }

    .toggle-state {
      color: #626978;
      font-size: 13px;
      font-weight: 700;
    }

    .toggle[aria-checked="true"] + .toggle-state {
      color: #6750d9;
    }

    /* 기존: 뽑기 및 초기화 버튼 */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .primary {
      border: 0;
      background: #6750d9;
      color: #fff;
    }

    .primary:hover:not(:disabled) {
      background: #5842c5;
    }

    .secondary {
      border: 1px solid #d7dbe5;
      background: #fff;
      color: #4e3bb1;
    }

    .secondary:hover:not(:disabled) {
      background: #f2f0ff;
    }

    [hidden] { display: none !important; }

    /* 변경 ①:
       레이스를 설정 화면 아래에 놓지 않고
       브라우저 표시 영역 전체를 덮도록 합니다.
       노션에서는 임베드 영역 안에서만 전체 화면이 됩니다.
    */
    body.race-open { overflow: hidden; }

    body.race-open .widget {
      visibility: hidden;
    }

    .race-area {
      position: fixed;
      inset: 0;
      z-index: 900;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: clamp(12px, 3vw, 28px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: linear-gradient(
        180deg, #f0ecff 0%, #f8f9fc 100%
      );
    }

    .race-title {
      flex: none;
      margin: 0;
      text-align: center;
      color: #4e3bb1;
      font-size: clamp(21px, 4vw, 32px);
      font-weight: 800;
    }

    .race-status {
      flex: none;
      margin: 0 0 3px;
      text-align: center;
      color: #626978;
      font-size: clamp(12px, 2vw, 16px);
    }

    /* 변경 ②:
       학생 수가 많을 때는 레이스 판 내부만 스크롤합니다.
       화면 전체에는 가로 스크롤이 생기지 않게 합니다.
    */
    .race-list {
      display: grid;
      grid-auto-rows: minmax(48px, auto);
      gap: 10px;
      align-content: safe center;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
      border: 1px solid #e3ddfa;
      border-radius: 16px;
      background: #fff;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .race-lane {
      display: grid;
      grid-template-columns: minmax(46px, 112px) minmax(0, 1fr);
      gap: 7px;
      align-items: center;
    }

    .race-name {
      min-width: 0;
      font-size: clamp(12px, 2.1vw, 16px);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .race-track {
      position: relative;
      height: clamp(36px, 5vh, 52px);
      min-width: 0;
      overflow: hidden;
      border: 1px solid #e2dff3;
      border-radius: 8px;
      background: #faf9ff;
    }

    .finish-line {
      position: absolute;
      top: 0;
      right: 4px;
      z-index: 1;
      width: 8px;
      height: 100%;
      background: repeating-conic-gradient(
        #777486 0 25%, #fff 0 50%
      ) 0 0 / 8px 8px;
    }

    .runner {
      position: absolute;
      top: 50%;
      left: 0;
      z-index: 2;
      width: 30px;
      text-align: center;
      font-size: 23px;
      line-height: 1;
      transform: translateY(-50%);
      user-select: none;
    }

    .race-lane.finished .race-track {
      border-color: #baaafb;
    }

    .race-lane.winner .race-track {
      background: #f2f0ff;
    }

    /* 기존: 당첨 결과와 기록 */
    .result {
      margin-top: 16px;
      padding: 18px 12px;
      border-radius: 12px;
      background: #f2f0ff;
      text-align: center;
    }

    .result-label {
      margin: 0 0 8px;
      color: #66617e;
      font-size: 12px;
      font-weight: 700;
    }

    #resultText {
      margin: 0;
      color: #4e3bb1;
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 800;
      line-height: 1.4;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .history {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid #e8eaf1;
      border-radius: 12px;
      background: #fff;
    }

    .history-title {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-item {
      padding: 7px 11px;
      border-radius: 99px;
      background: #f2f0ff;
      color: #4e3bb1;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .history-empty {
      color: #626978;
      font-size: 13px;
    }

    /* 기존: 2.5초 축하 효과 */
    .celebration {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 16px;
      background: rgba(30, 25, 58, .28);
      pointer-events: none;
    }

    .celebration-card {
      position: relative;
      z-index: 2;
      width: min(100%, 380px);
      max-height: 75vh;
      overflow-y: auto;
      padding: 24px 18px;
      border: 2px solid #ddd4ff;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 14px 40px #1c144b38;
      text-align: center;
      animation: prize-pop .6s ease-out both;
    }

    .celebration-card h2 {
      margin: 0 0 12px;
      color: #6750d9;
      font-size: 19px;
    }

    .celebration-winners {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .celebration-winners li {
      color: #4e3bb1;
      font-size: clamp(22px, 6vw, 32px);
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
      animation: prize-pop .55s ease-out both;
    }

    @keyframes prize-pop {
      0% {
        opacity: 0;
        transform: scale(.68);
      }
      65% {
        opacity: 1;
        transform: scale(1.13);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      top: -18px;
      left: var(--x);
      width: 9px;
      height: 15px;
      border-radius: 2px;
      opacity: 0;
      animation: confetti-fall 2.5s linear forwards;
      animation-delay: var(--delay);
    }

    @keyframes confetti-fall {
      0% {
        opacity: 1;
        transform: translate(0, -10px) rotate(0);
      }
      90% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(
          var(--drift), 105vh
        ) rotate(var(--spin));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .celebration-card,
      .celebration-winners li,
      .confetti {
        animation: none;
      }
    }

    @media (max-width: 360px) {
      body { padding: 8px; }
      .widget { padding: 14px; }
      .race-area { padding: 10px 8px; gap: 7px; }
      .race-list {
        padding: 9px 7px;
        gap: 7px;
        grid-auto-rows: minmax(42px, auto);
      }
      .race-lane {
        grid-template-columns: minmax(42px, 70px) minmax(0, 1fr);
        gap: 5px;
      }
    }
  </style>
</head>

<body>
  <main class="widget">
    <h1>🎲 랜덤 뽑기</h1>
    <p class="description">
      후보를 한 줄에 하나씩 입력한 뒤 버튼을 눌러주세요.
    </p>

    <label class="field-label" for="candidates">뽑기 후보</label>
    <textarea
      id="candidates"
      rows="5"
      placeholder="예시)&#10;김사과&#10;이바나나&#10;박포도"
    ></textarea>

    <div class="count-field">
      <div id="countLabel" class="field-label">뽑을 인원 (명)</div>
      <div class="stepper" role="group" aria-labelledby="countLabel">
        <button
          id="minusButton"
          class="stepper-button"
          type="button"
          aria-label="한 명 줄이기"
        >−</button>

        <output
          id="drawCount"
          class="stepper-value"
          aria-live="polite"
        >1명</output>

        <button
          id="plusButton"
          class="stepper-button"
          type="button"
          aria-label="한 명 늘리기"
        >+</button>
      </div>

      <p id="countHelp" class="help">
        후보를 입력하면 선택 가능한 인원이 표시돼요.
      </p>
    </div>

    <div class="repeat-field">
      <div class="repeat-row">
        <span id="repeatLabel" class="repeat-title">
          중복 당첨 방지
        </span>

        <div class="toggle-group">
          <button
            id="preventRepeat"
            class="toggle"
            type="button"
            role="switch"
            aria-checked="false"
            aria-labelledby="repeatLabel"
          >
            <span class="toggle-knob" aria-hidden="true"></span>
          </button>
          <span id="repeatState" class="toggle-state">OFF</span>
        </div>
      </div>

      <p class="help">
        ON이면 이전에 뽑힌 학생은 다음 추첨에서 제외돼요.
      </p>
    </div>

    <div class="actions">
      <button id="drawButton" class="primary" type="button">
        🏁 뽑기 시작
      </button>

      <button id="resetButton" class="secondary" type="button">
        전체 초기화
      </button>
    </div>

    <section class="result" role="status" aria-live="polite">
      <p class="result-label">뽑기 결과</p>
      <p id="resultText">아직 뽑지 않았어요!</p>
    </section>

    <section class="history">
      <h2 class="history-title">이미 뽑힌 학생</h2>
      <ul id="drawnHistoryList" class="history-list">
        <li class="history-empty">
          아직 뽑힌 학생이 없어요.
        </li>
      </ul>
    </section>
  </main>

  <!-- 변경: 레이스 화면을 설정 화면 바깥으로 분리합니다.
       position: fixed를 사용해 표시 영역 전체를 덮습니다. -->
  <section
    id="raceArea"
    class="race-area"
    role="dialog"
    aria-modal="true"
    aria-labelledby="raceTitle"
    aria-describedby="raceStatus"
    tabindex="-1"
    hidden
  >
    <h2 id="raceTitle" class="race-title">🏁 운명의 달리기</h2>
    <p id="raceStatus" class="race-status">
      누가 먼저 결승선에 도착할까요?
    </p>
    <div id="raceList" class="race-list"></div>
  </section>

  <!-- 기존: 당첨자 축하 오버레이 -->
  <div
    id="celebrationOverlay"
    class="celebration"
    hidden
    aria-hidden="true"
  >
    <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
    <section class="celebration-card">
      <h2>🎉 당첨을 축하해요!</h2>
      <ol id="celebrationWinners" class="celebration-winners"></ol>
    </section>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const candidatesInput = $('candidates');
    const drawButton = $('drawButton');
    const resetButton = $('resetButton');
    const preventRepeat = $('preventRepeat');
    const resultText = $('resultText');
    const drawnHistoryList = $('drawnHistoryList');

    let drawCount = 1;
    let isRacing = false;

    // 기존: 당첨된 학생 이름은 Set에 중복 없이 저장합니다.
    const drawnNames = new Set();

    function getCandidates() {
      return [...new Set(
        candidatesInput.value
          .split(/\r?\n/)
          .map(name => name.trim())
          .filter(Boolean)
      )];
    }

    // 기존: 후보 수에 따라 +/- 버튼을 조정합니다.
    function updateStepper() {
      const total = getCandidates().length;

      drawCount = total ? Math.min(drawCount, total) : 1;

      $('drawCount').textContent = `${drawCount}명`;

      $('minusButton').disabled =
        isRacing || total === 0 || drawCount <= 1;

      $('plusButton').disabled =
        isRacing || total === 0 || drawCount >= total;

      $('countHelp').textContent = total
        ? `1명부터 최대 ${total}명까지 선택할 수 있어요.`
        : '후보를 입력하면 선택 가능한 인원이 표시돼요.';
    }

    $('minusButton').addEventListener('click', () => {
      if (drawCount > 1) drawCount--;
      updateStepper();
    });

    $('plusButton').addEventListener('click', () => {
      if (drawCount < getCandidates().length) drawCount++;
      updateStepper();
    });

    candidatesInput.addEventListener('input', updateStepper);

    // 기존: 중복 방지 스위치를 변경합니다.
    preventRepeat.addEventListener('click', () => {
      const on =
        preventRepeat.getAttribute('aria-checked') === 'true';

      preventRepeat.setAttribute('aria-checked', String(!on));

      $('repeatState').textContent = on ? 'OFF' : 'ON';
    });

    // 기존: 당첨 기록 표시
    function renderHistory() {
      drawnHistoryList.replaceChildren();

      if (drawnNames.size === 0) {
        const li = document.createElement('li');
        li.className = 'history-empty';
        li.textContent = '아직 뽑힌 학생이 없어요.';
        drawnHistoryList.appendChild(li);
        return;
      }

      drawnNames.forEach(name => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.textContent = `${name} ✓`;
        drawnHistoryList.appendChild(li);
      });
    }

    // 기존: 경주와 축하 효과가 진행되는 동안
    // 모든 설정 버튼을 잠급니다.
    function lockControls(locked) {
      isRacing = locked;
      candidatesInput.disabled = locked;
      preventRepeat.disabled = locked;
      drawButton.disabled = locked;
      resetButton.disabled = locked;

      drawButton.textContent = locked
        ? '🏃 레이스 진행 중...'
        : '🏁 뽑기 시작';

      updateStepper();
    }

    // 변경: 뽑기를 시작하면 레이스 오버레이를 엽니다.
    // 설정 화면은 가리고 키보드 조작도 차단합니다.
    function showRaceScreen() {
      $('raceArea').hidden = false;
      document.body.classList.add('race-open');
      document.querySelector('.widget').inert = true;

      $('raceArea').focus({ preventScroll: true });
    }

    // 변경: 축하 효과가 끝나면 레이스 화면을 닫고
    // 기존 설정 화면으로 자동 복귀합니다.
    function hideRaceScreen() {
      $('raceArea').hidden = true;
      $('raceList').replaceChildren();

      document.body.classList.remove('race-open');
      document.querySelector('.widget').inert = false;

      lockControls(false);

      drawButton.focus({ preventScroll: true });
    }

    // 기존: 참가 학생별 레인과 달리기 캐릭터를 만듭니다.
    function makeLanes(names) {
      $('raceList').replaceChildren();

      return names.map(name => {
        const lane = document.createElement('div');
        lane.className = 'race-lane';

        const label = document.createElement('span');
        label.className = 'race-name';
        label.textContent = name;

        const track = document.createElement('div');
        track.className = 'race-track';

        const finish = document.createElement('span');
        finish.className = 'finish-line';

        const runner = document.createElement('span');
        runner.className = 'runner';
        runner.textContent = '🏃';

        track.append(finish, runner);
        lane.append(label, track);

        $('raceList').appendChild(lane);

        return { name, lane, runner, finished: false };
      });
    }

    // 기존: 학생마다 속도가 달라 보이게 만드는 함수입니다.
    // 최종 도착 순서는 추첨 시작 전에 결정됩니다.
    function progress(elapsed, finishTime, index) {
      if (elapsed >= finishTime) return 100;

      const ratio = Math.max(0, elapsed / finishTime);
      const phase = index * 2.13;
      const turns = 4 * Math.PI;

      const wave = (0.86 / turns) *
        (Math.sin(turns * ratio + phase) - Math.sin(phase));

      return Math.max(
        0, Math.min(99.8, (ratio + wave) * 100)
      );
    }

    // 기존: 당첨자와 색종이 폭죽을 2.5초 동안 보여줍니다.
    function celebrate(winners) {
      $('celebrationWinners').replaceChildren();
      $('confettiLayer').replaceChildren();

      winners.forEach((name, rank) => {
        const li = document.createElement('li');
        li.textContent = `${rank + 1}등 ${name}`;
        li.style.animationDelay = `${rank * 0.1}s`;
        $('celebrationWinners').appendChild(li);
      });

      const colors = [
        '#6750d9', '#ffcc64', '#ff85a1', '#67c9bc', '#8db8ff'
      ];

      // 외부 라이브러리 없이 색종이 48개를 생성합니다.
      for (let i = 0; i < 48; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';

        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.setProperty('--x', `${Math.random() * 100}%`);
        piece.style.setProperty('--delay', `${Math.random() * 0.25}s`);
        piece.style.setProperty(
          '--drift', `${(Math.random() - 0.5) * 160}px`
        );
        piece.style.setProperty(
          '--spin', `${360 + Math.random() * 720}deg`
        );

        $('confettiLayer').appendChild(piece);
      }

      $('celebrationOverlay').hidden = false;

      // 변경: 축하 효과가 끝나면 축하 카드뿐만 아니라
      // 레이스 화면도 함께 닫고 기본 화면으로 돌아갑니다.
      setTimeout(() => {
        $('celebrationOverlay').hidden = true;
        $('celebrationWinners').replaceChildren();
        $('confettiLayer').replaceChildren();

        hideRaceScreen();
      }, 2500);
    }

    // 기존: 미리 결정한 무작위 순위대로 경주합니다.
    function runRace(participants, order, winners) {
      const lanes = makeLanes(participants);

      const rank = new Map(
        order.map((name, i) => [name, i])
      );

      const times = lanes.map(entry =>
        participants.length === 1
          ? 6200
          : 5200 +
            rank.get(entry.name) / (participants.length - 1) * 2100
      );

      const start = performance.now();

      $('raceStatus').textContent =
        '모두 출발! 결승선을 향해 달리는 중...';

      resultText.textContent = '레이스 진행 중...';

      function frame(now) {
        const elapsed = now - start;
        let finished = 0;

        lanes.forEach((entry, i) => {
          const percent = progress(elapsed, times[i], i);

          entry.runner.style.left =
            `calc(${percent}% - ${percent * 0.30}px)`;

          if (percent === 100) {
            finished++;

            if (!entry.finished) {
              entry.finished = true;
              entry.lane.classList.add('finished');

              if (rank.get(entry.name) < winners.length) {
                entry.lane.classList.add('winner');
              }
            }
          }
        });

        if (finished < lanes.length) {
          requestAnimationFrame(frame);
          return;
        }

        // 경주 종료 후 당첨자를 기록합니다.
        winners.forEach(name => drawnNames.add(name));

        resultText.textContent = winners
          .map((name, i) => `${i + 1}등 ${name}`)
          .join('\n');

        $('raceStatus').textContent =
          '🏁 레이스 종료! 결승선에 먼저 도착한 학생이 당첨!';

        renderHistory();

        // 모든 참가자가 결승선에 도착한 뒤 축하 효과를 실행합니다.
        celebrate(winners);
      }

      requestAnimationFrame(frame);
    }

    // 기존: 추첨 시작 전에 무작위 도착 순서를 결정합니다.
    drawButton.addEventListener('click', () => {
      if (isRacing) return;

      const candidates = getCandidates();

      if (candidates.length === 0) {
        resultText.textContent = '후보를 입력해 주세요!';
        return;
      }

      updateStepper();

      const on =
        preventRepeat.getAttribute('aria-checked') === 'true';

      const available = on
        ? candidates.filter(name => !drawnNames.has(name))
        : candidates;

      if (available.length < drawCount) {
        resultText.textContent =
          `남은 후보는 ${available.length}명입니다. ` +
          '뽑을 인원을 줄이거나 중복 당첨 방지를 꺼 주세요!';
        return;
      }

      const order = [...available];

      // Fisher-Yates 무작위 섞기
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }

      lockControls(true);

      // 변경: 설정 화면 아래가 아닌 전체 레이스 화면에서 시작합니다.
      showRaceScreen();

      runRace(available, order, order.slice(0, drawCount));
    });

    // 변경: 확인창을 거치지 않고 바로 초기화합니다.
    // 학생 명단, 인원 설정, 중복 당첨 방지 설정은 건드리지 않습니다.
    resetButton.addEventListener('click', () => {
      if (isRacing) return;

      // 기존 당첨 기록을 모두 삭제합니다.
      drawnNames.clear();

      // 결과와 당첨자 목록을 처음 상태로 되돌립니다.
      resultText.textContent = '아직 뽑지 않았어요!';
      renderHistory();

      $('raceList').replaceChildren();
      $('raceArea').hidden = true;
    });

    updateStepper();
  </script>
</body>
</html>
